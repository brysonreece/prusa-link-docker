# Bridge-networking variant, for hosts where network_mode: host is unavailable
# (Docker Desktop on macOS/Windows) or unwanted.
#
# Read this first: PrusaLink will report the container's internal IP to Prusa
# Connect, so remote access through connect.prusa3d.com will not work, and mDNS
# discovery will advertise an unroutable address. The local web UI on
# http://<host>:8080 works normally. Accept that tradeoff knowingly.
#
#   docker compose -f compose.bridge.yaml up -d

services:
  prusalink:
    image: ghcr.io/brysonreece/prusalink:latest
    container_name: prusalink
    restart: unless-stopped

    # PrusaLink's shutdown is clean but not fast, and Docker's default grace
    # period is only 10s -- which SIGKILLs a healthy shutdown two-thirds of the
    # way through. prusa_link.stop() enqueues an M117 "PrusaLink stopped" to the
    # printer's LCD and then waits out STATE_CHANGE_TIMEOUT (const.py:86, 15s)
    # if the printer does not answer. Measured worst case with no printer
    # attached: 17s. 30s leaves margin.
    stop_grace_period: 30s

    ports:
      - "8080:8080"

    devices:
      # Required. Set PRUSALINK_DEVICE in a .env file next to this compose file
      # to your printer's stable by-id path -- find it with:
      #   ls -l /dev/serial/by-id/
      #
      # The by-id path matters: /dev/ttyACM0 renumbers when USB devices
      # enumerate in a different order after a reboot and the printer silently
      # becomes ttyACM1. This path derives from the printer's own serial number
      # and never changes. It is mapped to /dev/ttyACM0 inside the container so
      # the config stays boring.
      #
      # The :? form makes compose fail with the message below -- naming the
      # variable and how to find its value -- instead of letting Docker report
      # an opaque "no such file or directory" for a placeholder path.
      #
      # That message must not contain a colon: compose splits a device entry on
      # colons to find host:container, so a colon inside the message makes it
      # mis-split and report "missing a mount target" instead of the real error.
      - ${PRUSALINK_DEVICE:?set PRUSALINK_DEVICE to your printer's by-id path - run `ls -l /dev/serial/by-id/` to find it}:/dev/ttyACM0

    volumes:
      - ./data:/data
      - ./config:/etc/prusalink
      - /run/udev:/run/udev:ro

    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC

    security_opt:
      - no-new-privileges:true
